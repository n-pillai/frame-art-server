name: ci

# Mostly a smoke check rather than a test suite: the repo has a small set of
# real unit test files (test_logging_config.py, test_image_processor.py,
# test_label_sanitization.py, test_tv_no_mat.py, test_tv_delete.py,
# test_themes.py) and the rest of the steps below cover what can be checked
# without more. As real tests arrive they should replace these steps rather
# than accumulate alongside them.
#
# What it actually catches:
#   1. syntax errors in any module
#   2. an incomplete requirements.txt -- the import step installs ONLY what is
#      declared, so a dependency used in code but missing from the file fails
#      here instead of on a user's first run
#   3. a config.yaml that no longer parses, or has lost a section the code
#      reads unconditionally
#
# What it does NOT do: call the museum APIs. A live fetch would be flaky, slow,
# and rude to free public endpoints.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Compile every module
        run: python -m compileall -q batch_build.py art_sources.py image_processor.py tv_session.py tv_no_mat.py tv_delete.py probe_matte.py

      - name: Install only what requirements.txt declares
        run: pip install -r requirements.txt

      - name: Import every module against those declared deps
        # A module used in code but absent from requirements.txt fails here.
        # Note: importing batch_build configures logging with a FileHandler, so
        # this writes batch_build.log into the runner. Harmless, and gitignored.
        # The TV scripts import here too, WITHOUT samsungtvws installed (it is
        # deliberately not in requirements.txt) -- this guards the lazy-import
        # rule: the TV dependency must never creep up to module scope.
        run: |
          python -c "
          import batch_build, art_sources, image_processor
          import tv_session, tv_no_mat, tv_delete, probe_matte
          print('all modules import against declared dependencies')
          "

      - name: Logging configuration precedence
        run: python test_logging_config.py

      - name: Image processor pipeline
        run: python test_image_processor.py

      - name: Label sanitization
        run: python test_label_sanitization.py

      - name: No-mat pass logic
        run: python test_tv_no_mat.py

      - name: Bulk delete logic
        run: python test_tv_delete.py

      - name: Theme selection logic
        run: python test_themes.py

      - name: Validate config.yaml
        # Also validates the themes: catalog shape — a theme may only name the
        # four themeable sources and the two option keys, sources may only
        # carry queries/categories string lists. A malformed theme would
        # otherwise fail silently at runtime (unknown keys are just ignored).
        run: |
          python -c "
          import sys, yaml
          cfg = yaml.safe_load(open('config.yaml', encoding='utf-8'))
          required = {'display', 'art_sources', 'overlay', 'processing', 'storage', 'logging'}
          missing = required - set(cfg)
          if missing:
              sys.exit(f'config.yaml is missing required section(s): {sorted(missing)}')
          mode = cfg['display'].get('aspect_mode')
          if mode not in ('crop', 'matte'):
              sys.exit(f'display.aspect_mode must be crop or matte, got {mode!r}')
          themes = cfg.get('themes') or {}
          KNOWN_SOURCES = {'met_museum', 'art_institute_chicago', 'cleveland_museum', 'wikimedia_commons'}
          OPTION_KEYS = {'keywords_any', 'major_artists_only'}
          def is_str_list(v):
              return isinstance(v, list) and v and all(isinstance(x, str) for x in v)
          for name, theme in themes.items():
              if not isinstance(theme, dict):
                  sys.exit(f'theme {name!r} must be a mapping, got {type(theme).__name__}')
              unknown = set(theme) - KNOWN_SOURCES - OPTION_KEYS
              if unknown:
                  sys.exit(f'theme {name!r} has unknown key(s) {sorted(unknown)}; sources: {sorted(KNOWN_SOURCES)}, options: {sorted(OPTION_KEYS)}')
              if not set(theme) & KNOWN_SOURCES:
                  sys.exit(f'theme {name!r} names no sources')
              for src in sorted(set(theme) & KNOWN_SOURCES):
                  entry = theme[src]
                  if not isinstance(entry, dict):
                      sys.exit(f'theme {name!r} source {src!r} must be a mapping')
                  bad = set(entry) - {'queries', 'categories'}
                  if bad:
                      sys.exit(f'theme {name!r} source {src!r} has unknown key(s) {sorted(bad)}; only queries/categories allowed')
                  for key, values in entry.items():
                      if not is_str_list(values):
                          sys.exit(f'theme {name!r} {src}.{key} must be a non-empty list of strings')
              if 'keywords_any' in theme and not is_str_list(theme['keywords_any']):
                  sys.exit(f'theme {name!r} keywords_any must be a non-empty list of strings')
              if 'major_artists_only' in theme and not isinstance(theme['major_artists_only'], bool):
                  sys.exit(f'theme {name!r} major_artists_only must be true or false')
          print(f'config.yaml valid — {len(cfg)} sections, aspect_mode={mode}, {len(themes)} themes')
          "
