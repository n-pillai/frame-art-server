        - "dutch golden age landscape painting"

  women-artists:
    # Artemisia Gentileschi and Vigée Le Brun are not on the curated
    # major-artists list, so this theme must widen the artist filter.
    major_artists_only: false
    met_museum:
      queries:
        - "Berthe Morisot"
        - "Mary Cassatt"
        - "Artemisia Gentileschi"
        - "Vigée Le Brun"
        - "Rosa Bonheur"
        - "Angelica Kauffmann"
        - "Judith Leyster"
        - "Marie Bracquemond"
        - "Eva Gonzalès"
    art_institute_chicago:
      queries:
        - "Mary Cassatt"
        - "Berthe Morisot"
        - "Georgia O'Keeffe"
        - "Helen Frankenthaler"
        - "Rosa Bonheur"
        - "Angelica Kauffmann"
        - "Judith Leyster"
    cleveland_museum:
      queries:
        - "Cassatt"
        - "Morisot"
        - "Vigée Le Brun"
        - "Rosa Bonheur"
        - "Artemisia Gentileschi"
        - "Angelica Kauffmann"
        - "Judith Leyster"
        - "Sofonisba Anguissola"
    wikimedia_commons:
      categories:
        - "Paintings_by_Berthe_Morisot"
        - "Paintings_by_Mary_Cassatt"
        - "Paintings_by_Rosa_Bonheur"
        - "Paintings_by_Artemisia_Gentileschi"
        - "Paintings_by_Amrita_Sher-Gil"
        - "Paintings_by_Marie_Bracquemond"
        - "Paintings_by_Eva_Gonzalès"
        - "Paintings_by_Judith_Leyster"
        - "Paintings_by_Angelica_Kauffmann"
        # No "Paintings_by_..." category exists for her; the artist category
        # nests per-painting subcategories, which the category walker handles
        - "Élisabeth_Vigée_Le_Brun"
      queries:
        - "Berthe Morisot painting"
        - "Mary Cassatt painting"
        - "Rosa Bonheur painting"

  landscapes:
    # Close to the default config, curated down to pure landscape painters
    met_museum:
      queries:
        - "landscape painting"
        - "river landscape"
        - "mountain landscape"
        - "John Constable"
        - "J.M.W. Turner"
        - "Corot landscape"
        - "Caspar David Friedrich"
        - "Albert Bierstadt"
        - "Frederic Edwin Church"
    art_institute_chicago:
      queries:
        - "landscape"
        - "Camille Corot"
        - "American landscape"
        - "Winslow Homer"
        - "Hudson River School"
        - "Thomas Cole"
    cleveland_museum:
      queries:
        - "landscape"
        - "Turner"
        - "Corot"
        - "Frederic Church"
        - "Albert Bierstadt"
        - "Constable"
    wikimedia_commons:
      categories:
        - "Landscape_paintings_in_the_Louvre"
        - "Landscape_paintings_in_the_Musée_d'Orsay"
        - "Landscape_paintings_in_the_National_Gallery_of_Art"
        - "Paintings_by_John_Constable"
        - "Paintings_by_Joseph_Mallord_William_Turner"
        - "Paintings_by_Caspar_David_Friedrich"
        - "Paintings_by_Jean-Baptiste-Camille_Corot"
        - "Paintings_by_Albert_Bierstadt"
        - "Paintings_by_Frederic_Edwin_Church"
        - "Paintings_by_Thomas_Cole"
        - "Paintings_by_Isaac_Levitan"
        - "Paintings_by_Ivan_Shishkin"
      queries:
        - "Turner landscape painting"
        - "Constable landscape painting"

# --- Metadata Overlay ---
overlay:
  enabled: true                 # Show title + artist on the painting
  position: "top_left"          # "top_left" or "top_right"
  opacity: 0.90                 # 0.0 (invisible) to 1.0 (fully opaque)

# --- Image Processing ---
processing:
  # Target quality (1-100) for JPEG output
  jpeg_quality: 95

  # Apply subtle sharpening after resize (recommended for 4K display)
  sharpen: true

  # Color temperature adjustment to match Frame TV's warm display
  # Range: -20 (cooler) to +20 (warmer), 0 = no adjustment
  warmth_adjust: 3

  # Minimum source image dimensions (skip smaller images)
  min_width: 1500
  min_height: 1000

# --- Storage ---
storage:
  # Where to cache downloaded art
  cache_dir: "./art_cache"

  # Max downloads to keep cached locally — oldest are pruned after each batch
  max_cached: 500

# --- Logging ---
# Overridden by --log-level / --log-file on the command line; falls back to
# INFO and ./batch_build.log if this section is absent.
#
# The filename was "./frame_art.log" from the initial commit until 2026-08-07.
# That was the pre-April daemon's log, and the code reading this section went
# out with the daemon in the batch-build refactor -- so the setting sat unread
# while the code wrote to batch_build.log instead. Corrected to match what the
# tool actually does rather than reviving a dead filename.
logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "./batch_build.log"
