# =============================================================================
# Frame Art Server Configuration
# =============================================================================

# --- Display Settings ---
display:
  resolution: [3840, 2160]      # 4K UHD (use [1920, 1080] for 32" Frame)

  # Custom matte color (only used when aspect_mode is "matte")
  # Options: neutral, warm, cool, or a hex color like "#2C2C2C"
  matte_color: "neutral"

  # Mat toggle / aspect handling. Default is "crop" = NO mat.
  #   crop    - center-crop to fill the screen, no mat border (default)
  #   matte   - preserve aspect ratio, add a software mat border
  #   stretch - distort to fill (not recommended)
  # In crop mode, only landscape images (aspect ratio >= 1.3) are accepted.
  # Portraits and square images are automatically skipped.
  aspect_mode: "crop"

# --- Art Sources ---
art_sources:
  # When true, only accept works by well-known artists (Monet, Van Gogh,
  # Rembrandt, etc.). Great for the first USB rotation — "greatest hits" mode.
  # Set to false for a broader, more eclectic mix.
  major_artists_only: true

  # Maximum works per artist — prevents any one artist from dominating the
  # gallery. Featured artists use their own min_count as their cap instead.
  max_per_artist: 4

  # Featured artists — guaranteed a minimum number of works in every batch.
  # These are processed FIRST before filling the rest of the count randomly.
  # Use the artist name exactly as it appears in museum metadata (substring match).
  featured_artists:
    - name: "Raja Ravi Varma"
      min_count: 3
    - name: "Amrita Sher-Gil"
      min_count: 2

  met_museum:
    enabled: true
    # Mix of artist-specific and genre-based queries for broader coverage.
    # The script searches the European Paintings (dept 11) and Modern Art
    # (dept 21) departments first, then falls back to all departments.
    queries:
      # Genre / style queries (cast a wider net)
      - "landscape painting"
      - "oil on canvas landscape"
      - "impressionist painting"
      - "seascape"
      - "sunset painting"
      - "river landscape"
      - "mountain landscape"
      # Artist-specific queries
      - "Claude Monet"
      - "Vincent van Gogh"
      - "J.M.W. Turner"
      - "Winslow Homer"
      - "Camille Pissarro"
      - "Pierre-Auguste Renoir"
      - "Paul Cézanne"
      - "Frederic Edwin Church"
      - "Albert Bierstadt"
      - "Thomas Cole"
      - "Rembrandt"
      - "Caspar David Friedrich"
      - "John Constable"
      - "Gustave Courbet"
      - "Corot landscape"
      - "Hokusai"
      - "Hiroshige"
      - "Childe Hassam"
      - "Winslow Homer seascape"
      - "Millais"
      - "Waterhouse"
      - "Edward Hopper"
      - "Isaac Levitan"
    public_domain_only: true

  rijksmuseum:
    enabled: false   # Linked Data API doesn't support search; Rijks paintings available via Wikimedia
    queries:
      - "Vermeer"
      - "Rembrandt"
      - "Ruisdael"
      - "Hobbema"
      - "Cuyp"
    types:
      - "painting"

  art_institute_chicago:
    enabled: true
    queries:
      - "Claude Monet"
      - "Pierre-Auguste Renoir"
      - "Gustave Caillebotte"
      - "Paul Cézanne"
      - "Alfred Sisley"
      - "Camille Pissarro"
      - "Georges Seurat"
      - "Vincent van Gogh"
      - "Edward Hopper"
      - "Georgia O'Keeffe"
      - "Winslow Homer"

  cleveland_museum:
    enabled: true
    queries:
      - "Monet"
      - "Turner"
      - "Frederic Church"
      - "Albert Bierstadt"
      - "Courbet"
      - "Corot"
      - "Sorolla"
      - "Aivazovsky"
      - "Childe Hassam"
      - "Winslow Homer"
      - "Constable"

  wikimedia_commons:
    enabled: true
    # Wikimedia Commons hosts high-res scans from museums worldwide.
    # This is our gateway to the Louvre, Orsay, NGA, National Gallery London,
    # Prado, Uffizi, and many others — all through one API.
    categories:
      # --- By museum collection (major world museums) ---
      - "Landscape_paintings_in_the_Louvre"
      - "Landscape_paintings_in_the_Musée_d'Orsay"
      - "Paintings_in_the_National_Gallery,_London"
      - "Landscape_paintings_in_the_National_Gallery_of_Art"
      - "Paintings_in_the_Museo_del_Prado"
      - "Paintings_in_the_Uffizi_Gallery"
      - "Paintings_in_the_Hermitage"
      - "Paintings_in_the_Musée_de_l'Orangerie"
      - "Paintings_in_the_Alte_Pinakothek"
      - "Paintings_in_the_Kunsthistorisches_Museum"
      # --- By famous artist ---
      - "Paintings_by_Claude_Monet"
      - "Paintings_by_J._M._W._Turner"
      - "Paintings_by_John_Constable"
      - "Paintings_by_Caspar_David_Friedrich"
      - "Paintings_by_Ivan_Aivazovsky"
      - "Paintings_by_Joaquín_Sorolla"
      - "Paintings_by_Camille_Pissarro"
      - "Paintings_by_Alfred_Sisley"
      - "Paintings_by_Albert_Bierstadt"
      - "Paintings_by_Frederic_Edwin_Church"
      - "Paintings_by_Thomas_Cole"
      - "Paintings_by_Gustave_Courbet"
      - "Paintings_by_Jean-Baptiste-Camille_Corot"
      - "Paintings_by_Claude_Lorrain"
      # --- Pre-Raphaelites & British ---
      - "Paintings_by_John_Everett_Millais"
      - "Paintings_by_John_William_Waterhouse"
      - "Paintings_by_Edward_Burne-Jones"
      - "Paintings_by_Dante_Gabriel_Rossetti"
      - "Paintings_by_Frederic_Leighton"
      - "Paintings_by_John_Atkinson_Grimshaw"
      # --- Landscape & nature specialists ---
      - "Paintings_by_Isaac_Levitan"
      - "Paintings_by_Arkhip_Kuindzhi"
      - "Paintings_by_Ivan_Shishkin"
      # --- Maritime ---
      - "Paintings_by_Willem_van_de_Velde_the_Younger"
      # --- Abstract Expressionism ---
      - "Paintings_by_Mark_Rothko"
      - "Paintings_by_Jackson_Pollock"
      - "Paintings_by_Helen_Frankenthaler"
      # --- More Impressionism ---
      - "Paintings_by_Childe_Hassam"
      - "Paintings_by_Frédéric_Bazille"
      # --- Indian art ---
      - "Paintings_by_Raja_Ravi_Varma"
      - "Paintings_by_Amrita_Sher-Gil"
      - "Paintings_by_M._F._Husain"
    queries:
      - "Raja Ravi Varma painting"
      - "Amrita Sher-Gil painting"
      - "M.F. Husain painting"
      - "Ivan Aivazovsky seascape"
      - "Joaquín Sorolla beach painting"
      - "Turner landscape painting"
      - "Monet landscape painting Louvre"
      - "Constable landscape painting"
      - "Pissarro landscape"
      - "Sisley landscape"
      - "Isaac Levitan landscape"
      - "Arkhip Kuindzhi painting"
      - "Childe Hassam impressionist"
      - "John William Waterhouse painting"
      - "Edward Burne-Jones painting"
      - "Mark Rothko painting"
      - "Atkinson Grimshaw moonlight"

  # Local folder of your own images — included as-is (artist filters and
  # per-artist caps don't apply; landscape/size checks still do)
  local:
    enabled: false
    path: "./my_art"

# --- Themes ---
# Named bundles of per-source search inputs, selected with --theme <name>.
# A theme REPLACES the queries/categories above for the sources it names and
# disables the museum sources it does not name; everything else (filters,
# caps, featured artists) runs unchanged. See --list-themes for the catalog.
#
# Per theme, optionally:
#   keywords_any:       post-filter — keep only works whose title/medium/
#                       classification metadata contains one of these
#                       (case-insensitive substring)
#   major_artists_only: override the global setting above for this theme
#                       (themes whose artists are not on the curated
#                       major-artists list need `false` here)
themes:
  impressionist:
    met_museum:
      queries:
        - "impressionist painting"
        - "Claude Monet"
        - "Camille Pissarro"
        - "Alfred Sisley"
        - "Pierre-Auguste Renoir"
        - "Berthe Morisot"
        - "Edgar Degas"
        - "Mary Cassatt"
        - "Gustave Caillebotte"
        - "french impressionist landscape"
    art_institute_chicago:
      queries:
        - "Claude Monet"
        - "Pierre-Auguste Renoir"
        - "Gustave Caillebotte"
        - "Alfred Sisley"
        - "Camille Pissarro"
        - "Berthe Morisot"
        - "Edgar Degas"
        - "Mary Cassatt"
        - "Childe Hassam"
        - "Impressionism"
    cleveland_museum:
      queries:
        - "Monet"
        - "Pissarro"
        - "Sisley"
        - "Renoir"
        - "Degas"
        - "Caillebotte"
        - "Morisot"
        - "Cassatt"
        - "Childe Hassam"
        - "impressionist"
    wikimedia_commons:
      categories:
        - "Paintings_by_Claude_Monet"
        - "Paintings_by_Camille_Pissarro"
        - "Paintings_by_Alfred_Sisley"
        - "Paintings_by_Pierre-Auguste_Renoir"
        - "Paintings_by_Frédéric_Bazille"
        - "Paintings_by_Childe_Hassam"
        - "Paintings_by_Gustave_Caillebotte"
        - "Paintings_by_Berthe_Morisot"
        - "Paintings_by_Edgar_Degas"
        - "Paintings_by_Armand_Guillaumin"
        - "Paintings_by_Maximilien_Luce"
      queries:
        - "impressionist landscape painting"
        - "Monet landscape painting"
        - "Pissarro landscape"

  cityscapes:
    # Vedute, street scenes, and moonlit towns. Canaletto, Guardi, Grimshaw,
    # Hassam, and Caillebotte ARE on the major-artists list, but the generic
    # city/Venice queries surface many vedute painters who are not — without
    # the override the pool starves.
    major_artists_only: false
    met_museum:
      queries:
        - "Canaletto"
        - "Bernardo Bellotto"
        - "Venice view painting"
        - "cityscape painting"
        - "Camille Pissarro boulevard"
        - "city street painting"
        - "harbor view painting"
    art_institute_chicago:
      queries:
        - "Gustave Caillebotte"
        - "Childe Hassam"
        - "Paris street"
        - "cityscape"
        - "Venice"
        - "city view"
        - "street scene"
    cleveland_museum:
      queries:
        - "Canaletto"
        - "Bellotto"
        - "Guardi"
        - "cityscape"
        - "Venice"
        - "Childe Hassam"
        - "city view"
        - "street scene"
    wikimedia_commons:
      categories:
        # Canaletto's own works file under his birth name on Commons
        - "Paintings_by_Giovanni_Antonio_Canal"
        - "Paintings_by_Bernardo_Bellotto"
        - "Paintings_by_Francesco_Guardi"
        - "Paintings_by_John_Atkinson_Grimshaw"
        - "Paintings_by_Childe_Hassam"
        - "Paintings_of_cities"
      queries:
        - "Canaletto Venice painting"
        - "cityscape painting"
        - "Grimshaw moonlight street"

  old-masters:
    met_museum:
      queries:
        - "Rembrandt"
        - "Peter Paul Rubens"
        - "Anthony van Dyck"
        - "Frans Hals"
        - "Titian"
        - "Nicolas Poussin"
        - "Claude Lorrain"
        - "dutch golden age landscape"
    art_institute_chicago:
      queries:
        - "Rembrandt"
        - "Frans Hals"
        - "El Greco"
        - "Titian"
        - "Rubens"
        - "Dutch painting"
        - "old master"
    cleveland_museum:
      queries:
        - "Rembrandt"
        - "Rubens"
        - "Poussin"
        - "Claude Lorrain"
        - "van Dyck"
        - "Titian"
        - "Frans Hals"
        - "El Greco"
    wikimedia_commons:
      categories:
        - "Paintings_by_Rembrandt"
        - "Paintings_by_Peter_Paul_Rubens"
        - "Paintings_by_Claude_Lorrain"
        - "Paintings_by_Jacob_van_Ruisdael"
        - "Paintings_by_Meindert_Hobbema"
        - "Paintings_by_Aelbert_Cuyp"
        - "Paintings_by_Anthony_van_Dyck"
        - "Paintings_by_Frans_Hals"
        - "Paintings_by_Titian"
